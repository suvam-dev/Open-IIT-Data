baseline_models:
  logistic_regression:
    max_iter: 1000
    random_state: 42
    class_weight: "balanced"

candidate_models:
  random_forest:
    n_estimators: 200
    random_state: 42
    class_weight: "balanced"
    min_samples_leaf: 5
    n_jobs: -1

  hist_gradient_boosting:
    random_state: 42
    max_iter: 300
    learning_rate: 0.05
    max_depth: 6
    min_samples_leaf: 20

tuning_grids:
  hist_gradient_boosting:
    max_iter: [150, 300]
    learning_rate: [0.03, 0.05, 0.1]
    max_depth: [4, 6, 8]
    min_samples_leaf: [10, 20, 30]
